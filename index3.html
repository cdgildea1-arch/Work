<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143c42">
  <title>IH Properties | Work Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23143c42'/%3E%3Cpath d='m8 16 5 5 11-12' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183239;background:#f1f4f6;font-synthesis:none;--ink:#183239;--brand:#143c42;--muted:#5c727a;--line:#d9e3e6;--paper:#fff;--accent:#e7f0f2;--danger:#a12828}
    *{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.topbar{height:82px;max-width:1040px;margin:auto;padding:0 22px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px;color:var(--brand);font-weight:850;letter-spacing:.08em;font-size:14px}.brand small{display:block;color:#637980;font-size:13px;font-weight:550;letter-spacing:0;margin-top:3px}.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:11px;background:var(--brand);color:#fff;font-size:27px}.tabs{max-width:1040px;margin:auto;padding:0 22px;display:flex;gap:8px;overflow:auto}.tab{border:0;background:transparent;padding:14px 18px;color:#5b7179;font-weight:700;border-bottom:3px solid transparent}.tab.active{color:var(--brand);border-color:var(--brand)}
    main{max-width:1000px;margin:auto;padding:34px 22px 110px}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:26px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.14em;color:#58747c}.pagehead h1,h1{font-size:clamp(32px,5vw,46px);letter-spacing:-.04em;line-height:1.08;margin:9px 0}.pagehead p,p{color:var(--muted);font-size:16px;line-height:1.55;margin:8px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary,.iconbtn{border-radius:10px;min-height:46px;font-weight:700}.primary{border:0;background:var(--brand);color:#fff;padding:12px 20px}.primary:hover{background:#215b63}.secondary{border:1px solid #afc2c8;background:#fff;color:#245864;padding:11px 16px}.iconbtn{border:0;background:transparent;color:#48656e;padding:9px}.danger{color:var(--danger)}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:24px;box-shadow:0 3px 9px #143c4207}.section{margin-top:28px}.sectionbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionbar h2{margin:0;font-size:21px}.countpill{background:var(--accent);color:#315b64;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:750}
    .formcard{margin-bottom:20px}.formgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:13px}.formgrid.wide{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:720;color:#29444b}input:not([type=checkbox]),textarea,select{display:block;width:100%;border:1px solid #b6c7cc;border-radius:9px;background:#fcfdfe;color:var(--ink);padding:11px 12px;margin-top:6px;min-height:45px;font-size:16px}textarea{resize:vertical;min-height:96px}.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:15px}
    .items{display:grid;gap:11px}.item{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:13px;padding:17px 18px;background:#fff;border:1px solid var(--line);border-radius:14px}.item h3{font-size:17px;margin:0 0 5px}.item p{font-size:14px;margin:0;white-space:pre-wrap}.item small{display:block;color:#71858b;margin-top:7px}.checkbtn{appearance:none;width:23px;height:23px;border-radius:7px;border:2px solid #779197;margin:1px 0 0}.checkbtn:checked{background:var(--brand);border-color:var(--brand);position:relative}.checkbtn:checked:after{content:"✓";position:absolute;color:#fff;left:3px;top:-2px;font-weight:900}.item.done h3{text-decoration:line-through;color:#73868b}.priority{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.priority.high{background:#fde9e7;color:#8f3128}.priority.low{background:#edf1f2;color:#65777c}.empty{text-align:center;padding:38px 20px}.empty h2{margin:0 0 8px}.status{min-height:24px;color:#4b6972;margin:10px 0}.status.error{color:var(--danger)}
    .checklistgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.checklistcard{text-align:left;color:inherit}.checklistcard h3{font-size:19px;margin:10px 0 7px}.checklistcard small{color:#6a8087}.open{display:block;margin-top:18px;color:#236075;font-weight:750}
    .calendarbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.calendarbar h2{margin:0}.monthnav{display:flex;gap:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}.dow{text-align:center;padding:10px 3px;background:#edf3f4;font-size:12px;font-weight:800;color:#60777e}.day{min-height:105px;border:0;border-top:1px solid #e4eaec;border-right:1px solid #e4eaec;background:#fff;text-align:left;padding:9px;overflow:hidden}.day:nth-child(7n){border-right:0}.day.muted{background:#f7f9fa;color:#9aa8ac}.day.today .num{background:var(--brand);color:#fff}.num{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;font-weight:750}.dot{display:block;margin-top:5px;padding:3px 5px;border-radius:5px;background:#e4eff1;color:#315b65;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{font-size:11px;color:#61767c;margin-top:3px}.agenda{margin-top:18px}
    .handoffnote{border-left:5px solid #7d9da4}.handoffnote.high{border-left-color:#c75b4f}.handoffnote h3{margin-top:0}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.meta small{color:#6b7f85}.note-text{white-space:pre-wrap;color:#405d65;line-height:1.6}
    .back{border:0;background:transparent;color:#265d68;padding:5px 0;font-weight:700;margin-bottom:20px}.progress{font-size:26px;font-weight:800}.checkrow{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #edf1f3;font-weight:500;font-size:15px}.checkrow input{width:21px;height:21px;accent-color:var(--brand);flex:none}.detailsection{margin-bottom:18px}.detailsection h2{margin:0 0 12px}.savebar{position:sticky;bottom:12px;margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 10px 36px #15343c24}.savebar p{font-size:13px;margin:3px 0 0}
    .login{max-width:480px;margin:35px auto}.login h1{margin-top:10px}.login label{margin-top:17px}.login .primary{width:100%;margin-top:20px}.hidden{display:none!important}
    @media(max-width:700px){.topbar{height:76px;padding:0 16px}.tabs{padding:0 8px}.tab{flex:1;padding:13px 11px}.topbar .secondary{min-height:40px;padding:8px 11px}main{padding:25px 15px 90px}.pagehead{align-items:stretch;flex-direction:column}.pagehead .primary{width:100%}.formgrid,.formgrid.wide{grid-template-columns:1fr}.checklistgrid{grid-template-columns:1fr}.card{padding:20px 17px}.day{min-height:78px;padding:5px}.dot{font-size:0;width:7px;height:7px;border-radius:50%;padding:0}.more{display:none}.savebar{align-items:stretch;flex-direction:column}.savebar .primary{width:100%}}
  </style>
</head>
<body><div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';

const supabase=createClient('https://jsuqvogsqjuynqlfkobx.supabase.co','sb_publishable_bRGUDXoOxdQF-FuD7MKGYg_1vXsCnCo');
const app=document.querySelector('#app');
let user=null,items=[],checklists=[],view='tasks',month=new Date(),selectedDate=null,currentChecklist=null,dirty=false,saving=false;
const groups=[['Before arrival',['Confirm appointment time, meeting location, and deputy contact.','Bring ID, writ information, phone, charger, and keys.','Arrange replacement locks or locksmith and confirm crew requirements.']],['Confirm possession',['Let the constable direct entry and handle anyone still present.','Confirm possession before changing locks, even if the home looks empty.','Record deputy name and completion time; request the writ/return.']],['Document the property',['Take walkthrough video and photos before moving or cleaning anything.','Include every room, garage, yard, damage, appliances, and belongings.','List remaining belongings and get the constable’s handling instructions.','Check leaks, utility status, missing items, and urgent repairs.']],['Secure and close out',['After possession is confirmed, rekey doors and reset access codes.','Secure windows, exterior doors, and garage; verify locks work.','Save photos, possession notes, writ/return, and receipts in Buildium.','List cleanup and repair needs, obtain costs, and update Chase.']]];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'No date';
const shell=body=>`<header><div class="topbar"><div class="brand"><span class="mark">✓</span><span>IH PROPERTIES<small>Work hub</small></span></div>${user?'<button id="signout" class="secondary">Sign out</button>':''}</div>${user&&!currentChecklist?`<nav class="tabs"><button class="tab ${view==='tasks'?'active':''}" data-view="tasks">Tasks</button><button class="tab ${view==='calendar'?'active':''}" data-view="calendar">Calendar</button><button class="tab ${view==='handoff'?'active':''}" data-view="handoff">Handoff</button></nav>`:''}</header><main>${body}</main>`;
function bindShell(){document.querySelector('#signout')?.addEventListener('click',async()=>{if(dirty&&!confirm('Leave without saving your checklist changes?'))return;await supabase.auth.signOut()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;currentChecklist=null;render()})}
function set(html){app.innerHTML=shell(html);bindShell()}
function status(msg='',error=false){const el=document.querySelector('#status');if(el){el.textContent=msg;el.classList.toggle('error',error)}}

function login(message=''){set(`<section class="login card"><div class="eyebrow">YOUR WORKSPACE</div><h1>Pick up where<br>you left off.</h1><p>Sign in to open your private IH Properties work hub.</p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button></form><p id="status" class="status ${message?'error':''}">${esc(message)}</p></section>`);document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;status('Signing in…');const f=new FormData(e.target);const {data,error}=await supabase.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){status(error.message,true);b.disabled=false}else{user=data.user;await load()}}}

async function load(){status('Loading…');const [a,b]=await Promise.all([supabase.from('workspace_items').select('*').order('created_at',{ascending:false}),supabase.from('checklists').select('*').order('updated_at',{ascending:false})]);if(a.error||b.error){set(`<div class="card"><h2>Could not open the workspace</h2><p id="status" class="status error">${esc((a.error||b.error).message)}</p></div>`);return}items=a.data||[];checklists=b.data||[];render()}
function render(){if(!user)return login();if(currentChecklist)return renderChecklist();if(view==='calendar')return renderCalendar();if(view==='handoff')return renderHandoff();renderTasks()}

function itemForm(kind,defaultDate=''){const label=kind==='task'?'Task':kind==='event'?'Calendar item':'Handoff note';return `<form id="itemform" class="card formcard"><div class="formgrid"><label>${label}<input name="title" maxlength="300" required placeholder="${kind==='handoff'?'What does the next person need to know?':kind==='event'?'Appointment or deadline':'What needs to get done?'}"></label><label>${kind==='event'?'Date':'Due date'}<input name="item_date" type="date" value="${esc(defaultDate)}"></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label><label class="full">${kind==='handoff'?'Handoff details':'Notes'}<textarea name="details" maxlength="8000" placeholder="Add property, contact, status, or next steps"></textarea></label></div><div class="formactions"><button type="button" id="cancel" class="secondary">Cancel</button><button class="primary">Save ${label.toLowerCase()}</button></div><p id="status" class="status"></p></form>`}
function bindItemForm(kind,after){const form=document.querySelector('#itemform');document.querySelector('#cancel').onclick=after;form.onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;status('Saving…');const f=new FormData(form);const payload={owner_id:user.id,kind,title:String(f.get('title')).trim(),details:String(f.get('details')).trim(),item_date:f.get('item_date')||null,priority:f.get('priority')};const {data,error}=await supabase.from('workspace_items').insert(payload).select().single();if(error){status(error.message,true);b.disabled=false;return}items.unshift(data);after()}}
async function removeItem(id){if(!confirm('Delete this item?'))return;const {error}=await supabase.from('workspace_items').delete().eq('id',id);if(error)return alert(error.message);items=items.filter(x=>x.id!==id);render()}
async function toggleTask(id,completed){const {data,error}=await supabase.from('workspace_items').update({completed,updated_at:new Date().toISOString()}).eq('id',id).select().single();if(error)return alert(error.message);items=items.map(x=>x.id===id?data:x);renderTasks()}
const itemRow=x=>`<article class="item ${x.completed?'done':''}">${x.kind==='task'?`<input class="checkbtn" type="checkbox" data-toggle="${x.id}" ${x.completed?'checked':''}>`:'<span></span>'}<div><div class="meta"><span class="priority ${x.priority}">${x.priority}</span>${x.item_date?`<small>${dateLabel(x.item_date)}</small>`:''}</div><h3>${esc(x.title)}</h3>${x.details?`<p>${esc(x.details)}</p>`:''}</div><button class="iconbtn danger" data-delete="${x.id}" aria-label="Delete">Delete</button></article>`;
function bindRows(){document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeItem(b.dataset.delete));document.querySelectorAll('[data-toggle]').forEach(b=>b.onchange=()=>toggleTask(b.dataset.toggle,b.checked))}

function renderTasks(showForm=false){const tasks=items.filter(x=>x.kind==='task').sort((a,b)=>Number(a.completed)-Number(b.completed)||(a.item_date||'9999').localeCompare(b.item_date||'9999'));set(`<div class="pagehead"><div><div class="eyebrow">WORKSPACE</div><h1>Tasks</h1><p>Today’s work, deadlines, and field checklists.</p></div><button id="add" class="primary">+ Add task</button></div>${showForm?itemForm('task'):''}<section class="section"><div class="sectionbar"><h2>Task list</h2><span class="countpill">${tasks.filter(x=>!x.completed).length} open</span></div><div class="items">${tasks.length?tasks.map(itemRow).join(''):'<div class="empty card"><h2>No tasks yet.</h2><p>Add the next thing that needs to get done.</p></div>'}</div></section><section class="section"><div class="sectionbar"><h2>Field checklists</h2><button id="newcheck" class="secondary">+ Lockout checklist</button></div><div class="checklistgrid">${checklists.length?checklists.map(c=>`<button class="card checklistcard" data-checklist="${c.id}"><span class="eyebrow">LOCKOUT APPOINTMENT</span><h3>${esc(c.property)}</h3><small>${dateLabel(c.appointment_date)} · ${countChecks(c)} of 14 done</small><span class="open">Open checklist →</span></button>`).join(''):'<div class="empty card"><p>No field checklists yet.</p></div>'}</div></section>`);document.querySelector('#add').onclick=()=>renderTasks(true);if(showForm)bindItemForm('task',()=>renderTasks(false));document.querySelector('#newcheck').onclick=()=>{currentChecklist=newChecklist();renderChecklist()};document.querySelectorAll('[data-checklist]').forEach(b=>b.onclick=()=>{currentChecklist=structuredClone(checklists.find(c=>c.id===b.dataset.checklist));renderChecklist()});bindRows()}

function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderCalendar(showForm=false){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());const days=Array.from({length:42},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));const events=items.filter(x=>x.kind==='event');set(`<div class="pagehead"><div><div class="eyebrow">SCHEDULE</div><h1>Calendar</h1><p>Add appointments, deadlines, and property visits.</p></div><button id="add" class="primary">+ Add calendar item</button></div>${showForm?itemForm('event',selectedDate||iso(new Date())):''}<section><div class="calendarbar"><div class="monthnav"><button id="prev" class="secondary">←</button><button id="today" class="secondary">Today</button><button id="next" class="secondary">→</button></div><h2>${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}${days.map(d=>{const key=iso(d),dayEvents=events.filter(e=>e.item_date===key);return `<button class="day ${d.getMonth()!==m?'muted':''} ${key===iso(new Date())?'today':''}" data-day="${key}"><span class="num">${d.getDate()}</span>${dayEvents.slice(0,2).map(e=>`<span class="dot">${esc(e.title)}</span>`).join('')}${dayEvents.length>2?`<div class="more">+${dayEvents.length-2} more</div>`:''}</button>`}).join('')}</div></section>${selectedDate?`<section class="agenda"><div class="sectionbar"><h2>${dateLabel(selectedDate)}</h2></div><div class="items">${events.filter(e=>e.item_date===selectedDate).length?events.filter(e=>e.item_date===selectedDate).map(itemRow).join(''):'<div class="empty card"><p>Nothing scheduled this day.</p></div>'}</div></section>`:''}`);document.querySelector('#add').onclick=()=>renderCalendar(true);if(showForm)bindItemForm('event',()=>renderCalendar(false));document.querySelector('#prev').onclick=()=>{month=new Date(y,m-1,1);selectedDate=null;renderCalendar()};document.querySelector('#next').onclick=()=>{month=new Date(y,m+1,1);selectedDate=null;renderCalendar()};document.querySelector('#today').onclick=()=>{month=new Date();selectedDate=iso(new Date());renderCalendar()};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.day;month=new Date(selectedDate+'T12:00:00');renderCalendar()});bindRows()}

function renderHandoff(showForm=false){const notes=items.filter(x=>x.kind==='handoff');set(`<div class="pagehead"><div><div class="eyebrow">TEAM NOTES</div><h1>Handoff</h1><p>Leave clear context, current status, and the next action.</p></div><button id="add" class="primary">+ Add handoff</button></div>${showForm?itemForm('handoff'):''}<div class="items">${notes.length?notes.map(x=>`<article class="card handoffnote ${x.priority}"><div class="meta"><span class="priority ${x.priority}">${x.priority}</span>${x.item_date?`<small>Follow up ${dateLabel(x.item_date)}</small>`:''}<small>${new Date(x.created_at).toLocaleString()}</small></div><h3>${esc(x.title)}</h3>${x.details?`<div class="note-text">${esc(x.details)}</div>`:''}<div class="formactions"><button class="iconbtn danger" data-delete="${x.id}">Delete</button></div></article>`).join(''):'<div class="empty card"><h2>No handoff notes yet.</h2><p>Add anything the next person needs to pick up smoothly.</p></div>'}</div>`);document.querySelector('#add').onclick=()=>renderHandoff(true);if(showForm)bindItemForm('handoff',()=>renderHandoff(false));bindRows()}

function newChecklist(){return{id:crypto.randomUUID(),property:'New property',appointment_date:'',data:{appointment_time:'10:00',completed_by:'',checks:{}},version:0}}
function countChecks(c){return groups.flatMap((g,i)=>g[1].map((_,j)=>c.data?.checks?.[`${i}-${j}`]===true)).filter(Boolean).length}
const field=(key,label,type='text',top=false)=>`<label>${label}<input data-key="${key}" ${top?'data-top="true"':''} type="${type}" value="${esc(top?currentChecklist[key]:currentChecklist.data[key])}"></label>`;
const area=(key,label)=>`<label class="full">${label}<textarea data-key="${key}" rows="3">${esc(currentChecklist.data[key])}</textarea></label>`;
function renderChecklist(){const c=currentChecklist;set(`<button id="back" class="back">← Tasks</button><div class="pagehead"><div><div class="eyebrow">LOCKOUT APPOINTMENT</div><h1 id="ctitle">${esc(c.property)}</h1><p>10 AM appointment? Plan to arrive by 9:45.</p></div><div><span id="progress" class="progress">${countChecks(c)} / 14</span><p>tasks complete</p></div></div><form id="checkform"><section class="card detailsection"><h2>Appointment details</h2><div class="formgrid wide">${field('property','Property','text',true)}${field('appointment_date','Appointment date','date',true)}${field('appointment_time','Appointment time','time')}${field('completed_by','Completed by')}${field('case_number','Case number')}${field('deputy','Deputy name / contact')}</div></section>${groups.map(([title,rows],i)=>`<section class="card detailsection"><h2>${i+1}. ${title}</h2>${rows.map((row,j)=>`<label class="checkrow"><input type="checkbox" data-check="${i}-${j}" ${c.data.checks?.[`${i}-${j}`]?'checked':''}><span>${row}</span></label>`).join('')}${i===1?`<div class="formgrid wide">${field('possession_time','Possession confirmed at')}${field('occupancy','Occupancy / outcome observed')}</div>`:''}${i===2?`<div class="formgrid wide">${area('condition','Condition / damage / utilities')}${area('belongings','Belongings / constable instructions')}${area('urgent','Immediate concerns / actions')}</div>`:''}${i===3?`<div class="formgrid wide">${area('next_steps','Next steps / responsible person / cost')}${field('photo_reference','Photo / video or Buildium reference')}</div>`:''}</section>`).join('')}<section class="card detailsection"><h2>Update to Chase</h2><div class="formgrid wide">${area('chase_update','Follow-up message')}</div></section><div class="card savebar"><div><strong id="savestate">${c.version?'Saved online':'New checklist — not saved yet'}</strong><p id="status" class="status">${c.updated_at?'Last saved '+new Date(c.updated_at).toLocaleString():'Save to access this checklist on other devices.'}</p></div><button class="primary">Save checklist</button></div></form>`);document.querySelector('#back').onclick=()=>{if(dirty&&!confirm('Leave without saving changes?'))return;currentChecklist=null;dirty=false;renderTasks()};const form=document.querySelector('#checkform');form.oninput=e=>{const t=e.target;if(t.dataset.check){c.data.checks??={};c.data.checks[t.dataset.check]=t.checked}else if(t.dataset.key){if(t.dataset.top)c[t.dataset.key]=t.value;else c.data[t.dataset.key]=t.value}else return;dirty=true;document.querySelector('#progress').textContent=`${countChecks(c)} / 14`;document.querySelector('#ctitle').textContent=c.property;document.querySelector('#savestate').textContent='Unsaved changes'};form.onsubmit=saveChecklist}
async function saveChecklist(e){e.preventDefault();if(saving)return;saving=true;e.submitter.disabled=true;status('Saving online…');const payload={id:currentChecklist.id,owner_id:user.id,property:currentChecklist.property.trim()||'Untitled property',appointment_date:currentChecklist.appointment_date||null,data:currentChecklist.data};const query=currentChecklist.version?supabase.from('checklists').update(payload).eq('id',currentChecklist.id):supabase.from('checklists').insert(payload);const {data,error}=await query.select().single();saving=false;e.submitter.disabled=false;if(error){status(error.message,true);return}currentChecklist=data;dirty=false;checklists=checklists.filter(x=>x.id!==data.id);checklists.unshift(data);document.querySelector('#savestate').textContent='Saved online';status('Last saved '+new Date(data.updated_at).toLocaleString())}

window.addEventListener('beforeunload',e=>{if(dirty||saving){e.preventDefault();e.returnValue=''}});
supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;items=[];checklists=[];currentChecklist=null;login('You have been signed out.')}else if(session)user=session.user});
const {data:{session},error}=await supabase.auth.getSession();if(error)login(error.message);else if(session){user=session.user;await load()}else login();
</script></body></html>
